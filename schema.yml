openapi: 3.0.3
info:
  title: TaskFlow API
  version: 1.0.0
  description: TaskFlow task, department, team, calendar and analytics API.
paths:
  /api/v1/analytics/:
    get:
      operationId: api_v1_analytics_retrieve
      parameters:
      - in: query
        name: days
        schema:
          type: integer
          enum:
          - 30
          - 365
          - 7
          - 90
          default: 30
        description: Preset period. Ignored when start_date is supplied.
      - in: query
        name: department
        schema:
          type: string
          format: uuid
        description: Department UUID. Omit to include every accessible department.
      - in: query
        name: employee
        schema:
          type: string
          format: uuid
        description: Employee UUID from the selected accessible department(s).
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: Period end (YYYY-MM-DD); defaults to today.
      - in: query
        name: granularity
        schema:
          type: string
          enum:
          - day
          - month
          - week
        description: Trend bucket size; selected automatically when omitted.
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - high
          - low
          - medium
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Custom period start (YYYY-MM-DD).
      - in: query
        name: status
        schema:
          type: string
          enum:
          - backlog
          - completed
          - in_progress
          - not_started
          - on_hold
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
          description: ''
  /api/v1/auth/password-reset/:
    post:
      operationId: api_v1_auth_password_reset_create
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
