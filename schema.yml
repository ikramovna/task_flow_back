          description: ''
    delete:
      operationId: api_v1_conversations_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this conversation.
        required: true
      tags:
      - Conversations
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
