        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - manager
          - member
          - owner
        description: |-
          * `owner` - Owner
          * `admin` - Admin
          * `manager` - Manager
          * `member` - Member
      - name: search
        required: false
        in: query
        description: A search term.
