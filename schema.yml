components:
  schemas:
    AccountDelete:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
      required:
      - password
    AnalyticsResponse:
      type: object
      properties:
        meta: {}
        summary: {}
        charts: {}
        overdue: {}
        task_completion_rate:
          type: number
          format: double
        team_velocity:
          type: integer
        overdue_tasks:
          type: integer
        monthly_progress:
          type: array
          items: {}
        tasks_by_category:
          type: array
          items: {}
      required:
      - charts
      - meta
      - monthly_progress
      - overdue
      - overdue_tasks
      - summary
      - task_completion_rate
      - tasks_by_category
      - team_velocity
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        department:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          maxLength: 180
        is_group:
          type: boolean
        participants:
          type: array
          items:
            type: integer
          readOnly: true
        participant_details:
          type: array
          items:
            $ref: '#/components/schemas/UserBrief'
          readOnly: true
        last_message:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        unread_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - last_message
      - participant_details
      - participants
      - unread_count
      - updated_at
    DashboardResponse:
      type: object
      properties:
        summary: {}
        today_events: {}
        upcoming_events: {}
        upcoming_deadlines: {}
        tasks_by_department: {}
        recent_tasks: {}
      required:
      - recent_tasks
