      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - manager
          - member
          - owner
        description: |-
          * `owner` - Owner
          * `admin` - Admin
          * `manager` - Manager
          * `member` - Member
      - name: search
