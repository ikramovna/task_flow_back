components:
  schemas:
    AccountDelete:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
      required:
      - password
    AnalyticsResponse:
      type: object
      properties:
        task_completion_rate:
          type: number
          format: double
        team_velocity:
          type: integer
        overdue_tasks:
          type: integer
        monthly_progress:
          type: array
          items: {}
        tasks_by_category:
          type: array
          items: {}
      required:
      - monthly_progress
      - overdue_tasks
      - task_completion_rate
      - tasks_by_category
      - team_velocity
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        department:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          maxLength: 180
        is_group:
          type: boolean
        participants:
          type: array
          items:
            type: integer
          readOnly: true
        participant_details:
          type: array
          items:
            $ref: '#/components/schemas/UserBrief'
          readOnly: true
        last_message:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        unread_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - last_message
      - participant_details
      - participants
      - unread_count
      - updated_at
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        code:
          type: string
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        is_active:
          type: boolean
        member_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - member_count
      - name
      - updated_at
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        department:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          maxLength: 180
        event_type:
          type: string
          maxLength: 80
        description:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        location:
          type: string
          maxLength: 250
        meeting_url:
          type: string
          format: uri
          maxLength: 200
        attendees:
          type: array
          items:
            type: integer
        attendee_details:
          type: array
          items:
            $ref: '#/components/schemas/UserBrief'
          readOnly: true
        created_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attendee_details
      - created_at
      - created_by
      - ends_at
      - id
      - starts_at
      - title
      - updated_at
    Member:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 8
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        avatar:
          type: string
          format: uri
        phone:
          type: string
          maxLength: 32
        job_title:
          type: string
          maxLength: 120
        department:
          type: string
          format: uuid
          nullable: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        efficiency:
          type: integer
          readOnly: true
        completed_tasks:
          type: integer
          readOnly: true
        in_progress_tasks:
          type: integer
          readOnly: true
      required:
      - completed_tasks
      - date_joined
      - efficiency
      - email
      - full_name
      - id
      - in_progress_tasks
      - username
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        conversation:
          type: string
          format: uuid
        sender:
          type: integer
          readOnly: true
        sender_detail:
          allOf:
          - $ref: '#/components/schemas/UserBrief'
          readOnly: true
        body:
          type: string
        attachment:
          type: string
