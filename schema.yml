  /api/v1/members/:
    get:
      operationId: api_v1_members_list
      parameters:
      - in: query
        name: department
        schema:
          type: string
          format: uuid
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
